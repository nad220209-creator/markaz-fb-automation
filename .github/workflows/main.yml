name: Markaz Multi-Category Pipeline

on:
  schedule:
    - cron: '0 3,7,11,15,19 * * *'  # Runs automatically 5 times a day (1 category per run)
  workflow_dispatch:                 # Enables the manual "Run workflow" button (all 5 categories instantly)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth google-generativeai fpdf2 pillow

      - name: Run Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python main.py
