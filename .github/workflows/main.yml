name: Markaz Smart Automated Pipeline

on:
  schedule:
    - cron: '0 5,6,7,8,9,10 * * *'
  workflow_dispatch:
    inputs:
      manual_run:
        description: 'Run all categories manually'
        required: false
        default: 'true'
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth google-generativeai fpdf2 pillow

      - name: Run Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python main.py

      - name: Commit and Push Processed History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull origin main --rebase || true
          git add processed_history.json
          git commit -m "Update processed product history cache [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
