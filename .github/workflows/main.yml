- name: Commit Catalog and History Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch processed_history.json products.json PRODUCTS_CATALOG.md
          git add processed_history.json products.json PRODUCTS_CATALOG.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update product catalog and history" && git push)
